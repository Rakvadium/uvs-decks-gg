name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:
    # edited: re-run when the PR's base branch changes.
    types: [opened, synchronize, reopened, edited]
  # Nightly backstop for the secret scan: rescans the last 3 days of dev and master.
  # Scheduled runs ignore [skip ci], and the overlapping windows cover cancelled or missed runs.
  schedule:
    - cron: "23 4 * * *"

# A newer PR run replaces an older one for the same PR (it scans a superset). Push and
# scheduled runs each get their own group (run_id), so a later push can never cancel, or drop
# as pending, an earlier push's scan.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Lint
        run: bun run lint

  # Value-based scan for the real values of the secrets named in scripts/secret-scan/secrets.json.
  # Fails closed: --strict --ci fails if any required Actions secret (including the canary) is
  # missing. Runs on PRs (the PR's commits), on pushes to dev/master (the pushed commits), and
  # nightly (the last 3 days of dev and master). The range logic is scripts/secret-scan/ci-range.sh.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Fail on fork PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error title=secret-scan::Fork PRs get no Actions secrets, so the value scan cannot run here. A maintainer must run bun run secret-scan --strict --diff <base>..<head> locally before merging."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Fails the job when the range can't be determined (e.g. a force-pushed-over tip that
      # can't be fetched) instead of guessing.
      - name: Pick the commit ranges
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WINDOW: 3 days ago
          SCHEDULE_BRANCHES: dev master
        run: |
          set -euo pipefail
          ranges=$(bash scripts/secret-scan/ci-range.sh)
          echo "Scanning:"
          echo "$ranges"
          { echo "ranges<<RANGES_EOF"; echo "$ranges"; echo "RANGES_EOF"; } >> "$GITHUB_OUTPUT"

      # Keep this env list in sync with scripts/secret-scan/secrets.json (a test checks it).
      - name: Scan commits for secret values
        env:
          RANGES: ${{ steps.range.outputs.ranges }}
          AGENT_AUTH_SECRET: ${{ secrets.AGENT_AUTH_SECRET }}
          AGENT_AUTH_EMAIL: ${{ secrets.AGENT_AUTH_EMAIL }}
          AGENT_AUTH_PASSWORD: ${{ secrets.AGENT_AUTH_PASSWORD }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          AUTH_RESEND_KEY: ${{ secrets.AUTH_RESEND_KEY }}
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWKS: ${{ secrets.JWKS }}
          SECRET_SCAN_CANARY: ${{ secrets.SECRET_SCAN_CANARY }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r range; do
            if [ -n "$range" ]; then args+=(--diff "$range"); fi
          done <<< "$RANGES"
          if [ ${#args[@]} -eq 0 ]; then echo "::error title=secret-scan::no commit range to scan"; exit 1; fi
          bun run secret-scan --strict --ci "${args[@]}"

  # Pattern-based scan for well-known token formats. On pull_request events the
  # action scans only the PR's commits, so the old leak in history doesn't fail it.
  gitleaks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
